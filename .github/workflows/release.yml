name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION file matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($file_version)" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/how-to-run.md <<'EOF'
          No install needed beyond the source below - this is a local Python/Flask app, not a compiled
          binary. Download **Source code (zip)**, extract it, then:

          - **Windows:** double-click `start.bat`
          - **macOS:** double-click `start.command`
          - **Linux:** run `./start.sh`

          The launcher creates a `.venv` and installs dependencies on first run, then opens the app in
          your browser. Needs Python 3.10+ and Tesseract OCR - see the README for install steps.

          EOF
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/how-to-run.md --generate-notes

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION file matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($file_version)" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/how-to-run.md <<'EOF'
          **Windows, zero install:** download `pdf-ocr-corrector-windows-portable.zip` below, extract it
          anywhere, run `pdf-ocr-corrector.exe`. Tesseract is bundled - nothing else to install.

          **macOS / Linux, or if you'd rather run from source:** this route needs Python 3.10+ and
          Tesseract OCR already installed on your machine - see the README for install steps. Then
          download **Source code (zip)**, extract it, and run the launcher for your OS:

          - **macOS:** double-click `start.command`
          - **Linux:** run `./start.sh`
          - **Windows (source route):** double-click `start.bat`

          The launcher creates a `.venv` and installs Python *packages* on first run (not Python or
          Tesseract themselves), then opens the app in your browser.

          EOF
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/how-to-run.md --generate-notes --clobber

  build-windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Vendor Tesseract
        run: ./packaging/vendor_tesseract_windows.sh packaging/vendor/windows/tesseract

      - name: Build with PyInstaller
        run: pyinstaller --distpath packaging/dist --workpath packaging/build --noconfirm packaging/pdf-ocr-corrector.spec

      - name: Zip the portable build
        run: |
          cd packaging/dist
          7z a -tzip ../../pdf-ocr-corrector-windows-portable.zip pdf-ocr-corrector >/dev/null

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pdf-ocr-corrector-windows-portable.zip --clobber
